# Somente ensaio sintético; nenhuma configuração ou volume de produção.
name: lgd-architecture-drill
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: isolated-drill-only
      POSTGRES_DB: lgd_mantos_alignment_test
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
  backend:
    image: lgd-architecture-backend:verification
    environment: &configuration
      DATABASE_URL: postgresql+asyncpg://postgres:isolated-drill-only@db:5432/lgd_mantos_alignment_test
      APP_PASSWORD: isolated-drill-only
      APP_SECRET: isolated-drill-secret-not-production
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8002:8000"]
    volumes: ["drill_uploads:/app/app/static/uploads"]
  migrate:
    image: lgd-architecture-backend:verification
    profiles: [admin]
    environment: *configuration
    command: [python, init_db.py]
    depends_on:
      db:
        condition: service_healthy
volumes:
  drill_uploads:
