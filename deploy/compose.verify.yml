# Somente ensaio sintético; nenhuma configuração ou volume de produção.
name: lgd-bank-drill
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: isolated-drill-only
      POSTGRES_DB: lgd_mantos_alignment_test
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
  backend:
    image: lgd-bank-backend:verification
    environment:
      DATABASE_URL: postgresql+asyncpg://lgd_app:isolated-app-only@db:5432/lgd_mantos_alignment_test
      APP_PASSWORD: isolated-drill-only
      APP_SECRET: isolated-drill-secret-not-production
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8002:8000"]
    volumes: ["drill_uploads:/app/app/static/uploads"]
  migrate:
    image: lgd-bank-backend:verification
    profiles: [admin]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://lgd_migrator:isolated-migration-only@db:5432/lgd_mantos_alignment_test
    command: [python, init_db.py]
    volumes: ["drill_uploads:/app/app/static/uploads"]
    depends_on:
      db:
        condition: service_healthy
  bootstrap:
    image: lgd-bank-backend:verification
    profiles: [admin]
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql+asyncpg://postgres:isolated-drill-only@db:5432/lgd_mantos_alignment_test
      LGD_APP_PASSWORD: isolated-app-only
      LGD_MIGRATOR_PASSWORD: isolated-migration-only
    command: [python, bootstrap_database.py]
    depends_on:
      db:
        condition: service_healthy
volumes:
  drill_uploads:
