services:
  db:
    # Banco principal usado por todos os módulos do backend.
    image: postgres:16-alpine
    container_name: lgd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lgd_mantos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # Porta alta no host para não conflitar com outros Postgres locais.
      # Usada por ferramentas de desenvolvimento (Alembic, psql) fora do Docker.
      - "55432:5432"
    volumes:
      # Mantém os dados do PostgreSQL entre reinicializações dos containers.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # O backend só sobe depois que o banco responder ao pg_isready.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 8s
      timeout: 4s
      retries: 6

  backend:
    # API FastAPI com reload para desenvolvimento local.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lgd_mantos
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL com lgd_app}
      APP_PASSWORD: ${APP_PASSWORD:?defina APP_PASSWORD}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Monta o código local para refletir alterações sem reconstruir a imagem.
      - ./backend:/app
      # Preserva imagens enviadas pelo módulo operacional.
      - uploads_data:/app/app/static/uploads
    # Migrações são administrativas; a API inicia somente o servidor HTTP.
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"

  migrate:
    build: .
    profiles: [admin]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?defina MIGRATION_DATABASE_URL}
    command: [python, init_db.py]
    volumes:
      - uploads_data:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    build: .
    profiles: [admin]
    environment:
      BOOTSTRAP_DATABASE_URL: ${BOOTSTRAP_DATABASE_URL:?defina BOOTSTRAP_DATABASE_URL}
      LGD_APP_PASSWORD: ${LGD_APP_PASSWORD:?defina LGD_APP_PASSWORD}
      LGD_MIGRATOR_PASSWORD: ${LGD_MIGRATOR_PASSWORD:?defina LGD_MIGRATOR_PASSWORD}
    command: [python, bootstrap_database.py]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Frontend React/Vite para validar o fluxo completo local com a API Docker.
    image: node:20-alpine
    container_name: lgd_frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      # O browser no host acessa a API publicada em localhost:8000.
      VITE_API_URL: http://localhost:8000/api/v1
      # O proxy roda no container e acessa a API pelo nome do serviço.
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Dependências Linux ficam no Docker, sem resíduos no diretório do projeto.
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  # Volume persistente do PostgreSQL.
  pgdata:
  # Volume persistente para uploads de produtos.
  uploads_data:
  # Dependências regeneráveis do frontend de desenvolvimento.
  frontend_node_modules:
