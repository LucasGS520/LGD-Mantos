# docker-compose.prod.yml — stack de PRODUÇÃO do LGD Mantos em VPS único.
#
# Diferenças em relação ao docker-compose.yml (desenvolvimento):
#   - Nenhuma porta interna exposta ao host (banco só na rede interna).
#   - Backend sem --reload e sem montagem do código-fonte.
#   - Frontend buildado e servido pelo Caddy (serviço `web`), com HTTPS automático.
#   - Única exposição pública: portas 80/443 do Caddy.
#
# Uso no servidor:
#   Consulte docs/DEPLOY.md: migração é etapa administrativa antes do tráfego.
#
# Pré-requisitos: arquivo .env preenchido (DATABASE_URL, APP_PASSWORD, APP_SECRET,
# DOMAIN, CORS_ORIGINS) e DNS do domínio apontando para o IP do VPS.

services:
  db:
    # Banco principal — acessível apenas pela rede interna do compose.
    image: postgres:16-alpine
    container_name: lgd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lgd_mantos
      POSTGRES_USER: postgres
      # Defina POSTGRES_PASSWORD no .env — precisa casar com a DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 8s
      timeout: 4s
      retries: 6

  backend:
    # API FastAPI em modo produção (sem reload, código dentro da imagem).
    build:
      context: .
      dockerfile: Dockerfile
    image: lgd-mantos-backend:${LGD_RELEASE:-local}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: lgd_mantos
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL com lgd_app}
      APP_PASSWORD: ${APP_PASSWORD:?defina APP_PASSWORD}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      # Único volume: fotos enviadas pelo módulo operacional (persistentes).
      - uploads_data:/app/app/static/uploads

  migrate:
    # Executar uma única vez, com API parada e imagem da release escolhida.
    image: lgd-mantos-backend:${LGD_RELEASE:-local}
    profiles: [admin]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?defina MIGRATION_DATABASE_URL com lgd_migrator}
    command: ["python", "init_db.py"]
    volumes:
      - uploads_data:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    image: lgd-mantos-backend:${LGD_RELEASE:-local}
    profiles: [admin]
    environment:
      BOOTSTRAP_DATABASE_URL: ${BOOTSTRAP_DATABASE_URL:?defina BOOTSTRAP_DATABASE_URL}
      LGD_APP_PASSWORD: ${LGD_APP_PASSWORD:?defina LGD_APP_PASSWORD}
      LGD_MIGRATOR_PASSWORD: ${LGD_MIGRATOR_PASSWORD:?defina LGD_MIGRATOR_PASSWORD}
    command: ["python", "bootstrap_database.py"]
    depends_on:
      db:
        condition: service_healthy

  web:
    # Borda pública: React estático + reverse proxy da API + HTTPS automático.
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: lgd-mantos-web:${LGD_RELEASE:-local}
    container_name: lgd_web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env (ex. app.seudominio.com.br)}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Certificados e estado do Caddy — preserva os certificados entre deploys.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads_data:
  caddy_data:
  caddy_config:
