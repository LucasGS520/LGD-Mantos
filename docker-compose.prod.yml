# docker-compose.prod.yml — stack de PRODUÇÃO do LGD Mantos em VPS único.
#
# Diferenças em relação ao docker-compose.yml (desenvolvimento):
#   - Nenhuma porta interna exposta ao host (banco só na rede interna).
#   - Backend sem --reload e sem montagem do código-fonte.
#   - PWA buildado e servido pelo Caddy (serviço `web`), com HTTPS automático.
#   - Única exposição pública: portas 80/443 do Caddy.
#
# Uso no servidor:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Pré-requisitos: arquivo .env preenchido (DATABASE_URL, APP_PASSWORD, APP_SECRET,
# DOMAIN, CORS_ORIGINS) e DNS do domínio apontando para o IP do VPS.

services:
  db:
    # Banco principal — acessível apenas pela rede interna do compose.
    image: postgres:16-alpine
    container_name: lgd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lgd_mantos
      POSTGRES_USER: postgres
      # Defina POSTGRES_PASSWORD no .env — precisa casar com a DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 8s
      timeout: 4s
      retries: 6

  backend:
    # API FastAPI em modo produção (sem reload, código dentro da imagem).
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lgd_mantos
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Único volume: fotos enviadas pelo módulo operacional (persistentes).
      - uploads_data:/app/app/static/uploads

  web:
    # Borda pública: PWA estático + reverse proxy da API + HTTPS automático.
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: lgd_web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env (ex. app.seudominio.com.br)}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      # Certificados e estado do Caddy — preserva os certificados entre deploys.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads_data:
  caddy_data:
  caddy_config:
