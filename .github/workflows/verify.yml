name: Verificação
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: lgd_mantos_alignment_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://lgd_app:test-app-only@localhost:55432/lgd_mantos_alignment_test
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://lgd_migrator:test-migration-only@localhost:55432/lgd_mantos_alignment_test
      BOOTSTRAP_DATABASE_URL: postgresql+asyncpg://postgres:test-only@localhost:55432/lgd_mantos_alignment_test
      LGD_APP_PASSWORD: test-app-only
      LGD_MIGRATOR_PASSWORD: test-migration-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend deploy
      - run: python backend/check_boundaries.py
      - run: python backend/bootstrap_database.py
      - run: python backend/check.py
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run check:boundaries
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python backend/check.py --serve > /tmp/lgd-browser.log 2>&1 &
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-diagnostics
          path: |
            frontend/test-results/
            /tmp/lgd-browser.log
