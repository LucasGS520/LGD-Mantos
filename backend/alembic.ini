# Configuração do Alembic para o backend LGD Mantos.
# A URL do banco NÃO fica aqui — é lida de DATABASE_URL pelo migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = .

# Nome dos arquivos de migration: sequência + slug descritivo.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
