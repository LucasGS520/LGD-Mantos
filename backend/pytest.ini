; Configuração do pytest para o backend LGD Mantos.
; asyncio_mode=auto permite testes async sem decorators explícitos;
; o loop de sessão é compartilhado para suportar fixtures de banco por sessão.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
; Sem __init__.py em tests/, o modo de import padrão do pytest ("prepend") não
; coloca a raiz do backend em sys.path — "from tests.conftest import ..." e
; "import main"/"import app...*" quebrariam com ModuleNotFoundError. Isso expõe
; a raiz do projeto (onde este arquivo mora) para o sys.path da sessão de testes.
pythonpath = .
