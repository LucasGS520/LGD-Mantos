; Configuração do pytest para o backend LGD Mantos.
; asyncio_mode=auto permite testes async sem decorators explícitos;
; o loop de sessão é compartilhado para suportar fixtures de banco por sessão.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
